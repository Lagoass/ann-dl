site_name: ANN & DL — Gustavo Lagôa
site_author: Lagôa, G.
site_description: Entregas de Redes Neurais Artificiais e Deep Learning — Insper 2026.2
site_url: https://lagoass.github.io/ann-dl
repo_url: https://github.com/Lagoass/ann-dl
repo_name: Lagoass/ann-dl

theme:
  name: material
  language: pt-BR
  palette:
    # Padrão: modo escuro com acento âmbar
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro

    # Alternativa clara
    - scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - toc.follow
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  # Inclusão de arquivos (--8<--): traz os scripts de code/ para os relatórios
  - pymdownx.snippets:
      url_download: true
      check_paths: true
      base_path:
        - .
        - docs
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption
  - toc:
      permalink: true

plugins:
  - glightbox
  # A data da última alteração é a evidência do prazo de entrega
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - git-authors
  - search:
      lang:
        - pt
        - en
  - minify:
      minify_html: true
  - mkdocs-jupyter:
      execute: false
      allow_errors: false
      include_source: true
      # Sem isto, os .py de code/ virariam páginas do site
      include: ["*.ipynb"]

# Além dos links, valida as âncoras (#secao) — com --strict, âncora quebrada vira erro
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Os scripts de code/ ficam no repositório e são incluídos nos relatórios via --8<--,
# mas não são páginas da navegação.
not_in_nav: |
  /exercises/*/code/*
  /projects/*/code/*

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # A configuração precisa vir ANTES da biblioteca do MathJax
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Exercícios:
    # Este index.md precisa ser o PRIMEIRO filho: com navigation.indexes, o Material usa
    # o primeiro filho chamado index.md como página-índice da seção. Sem ele, o primeiro
    # exercises/<slug>/index.md era absorvido no título e sumia do menu.
    - exercises/index.md
    - Data:
      - exercises/data/index.md
      - "Anexo — Ex. 1 executado": exercises/data/ex1_point_clouds.ipynb
      - "Anexo — Ex. 2 executado": exercises/data/ex2_nonlinearity.ipynb
      - "Anexo — Ex. 3 executado": exercises/data/ex3_preprocessing.ipynb
    - Perceptron: exercises/perceptron/index.md
    - MLP: exercises/mlp/index.md
    - VAE: exercises/vae/index.md
  - Projeto:
    - projects/index.md
    - 1. EDA: projects/eda/index.md
    # Escolha UMA das duas linhas abaixo, e apague a outra (e a pasta que sobrar):
    - 2. Classificação: projects/classification/index.md
    - 2. Regressão: projects/regression/index.md
    - 3. Generativo: projects/generative/index.md
  - Raciocínio:
    - raciocinio/index.md
    - Data: raciocinio/data.md
    - Perceptron: raciocinio/perceptron.md
  - Sobre este site: setup/index.md
